let currentFilter = '';
const tooltip = document.getElementById('tooltip');

function filterSect(sect) {
  currentFilter = sect;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  updateGlobe();
}

function getData() {
  if (!currentFilter) return allData;
  return allData.filter(d => d.sect === currentFilter);
}

const globe = Globe()
  .globeImageUrl('/earth-night.jpg')
  .backgroundImageUrl('/night-sky.png')
  .pointsData(allData)
  .pointLat('lat')
  .pointLng('lng')
  .pointColor('color')
  .pointAltitude(d => {
    const g = parseInt(d.gen) || 10;
    return Math.max(0.01, (14 - g) * 0.015);
  })
  .pointRadius(d => {
    const g = parseInt(d.gen) || 10;
    return g <= 4 ? 0.4 : g <= 6 ? 0.25 : g <= 8 ? 0.15 : 0.08;
  })
  .pointLabel(d => `
    <div style="background:rgba(0,0,0,0.9);padding:8px 12px;border:1px solid #444;font-family:monospace;font-size:11px;line-height:1.6">
      <div style="font-size:13px;font-weight:bold;color:#fff">${d.name}</div>
      <div style="color:${d.color}">${d.clan}</div>
      <div>Gen ${d.gen} · ${d.sect || 'Unknown'}</div>
      ${d.embrace && d.embrace !== '?' ? '<div>Embraced ' + d.embrace + '</div>' : ''}
      ${d.sire ? '<div style="color:#666">Sire: ' + d.sire + '</div>' : ''}
      <div style="color:#444">${d.city} · ${d.source}</div>
    </div>
  `)
  .onPointHover(d => {
    document.body.style.cursor = d ? 'pointer' : 'default';
  })
  .width(window.innerWidth)
  .height(window.innerHeight)
  (document.getElementById('globe'));

// Start focused on Chicago
globe.pointOfView({ lat: 41.878, lng: -87.630, altitude: 1.8 }, 2000);

function updateGlobe() {
  globe.pointsData(getData());
}

window.addEventListener('resize', () => {
  globe.width(window.innerWidth).height(window.innerHeight);
});
