{{ define "main" }}
<article class="reference">
  <h1>{{ .Title }}</h1>
  <p class="subtitle">{{ len .Pages }} {{ if eq (len .Pages) 1 }}scene{{ else }}scenes{{ end }} tagged <strong>{{ .Title }}</strong></p>
  <ul class="scene-list" role="list">
    {{ range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
    </li>
    {{ end }}
  </ul>
</article>
{{ end }}
