{{ define "main" }}
<article class="reference {{ with .Params.heat_level }}heat-{{ . }}{{ end }} {{ with .Params.pc }}pc-{{ . | lower }}{{ end }} {{ with .Params.setting }}setting-{{ . | lower }}{{ end }} {{ if .Params.numbness_active }}numbness-active{{ end }}" aria-label="{{ .Title }}">
  <header>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}
      <p class="subtitle">{{ . }}</p>
    {{ end }}
  </header>

  {{ if or (.Params.ShowToc) (.Params.toc) }}
    <nav class="toc" aria-label="Table of contents">
      <strong>Contents</strong>
      {{ .TableOfContents }}
    </nav>
  {{ end }}

  {{ .Content }}

  {{ partial "reference-nav.html" . }}
</article>
{{ end }}
