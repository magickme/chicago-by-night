{{ define "main" }}
<article class="reference search-page" aria-label="Search">
  <header>
    <h1>Search</h1>
  </header>

  <div id="search"></div>

  <link href="/pagefind/pagefind-ui.css" rel="stylesheet">
  <script src="/pagefind/pagefind-ui.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      var ui = new PagefindUI({
        element: '#search',
        showSubResults: true,
        showImages: false,
        resetStyles: false
      });
      // Auto-fill from ?q= parameter
      var params = new URLSearchParams(window.location.search);
      var q = params.get('q');
      if (q) {
        ui.triggerSearch(q);
      }
    });
  </script>
</article>
{{ end }}
