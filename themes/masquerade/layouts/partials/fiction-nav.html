<nav class="fiction-nav" aria-label="Story navigation">
  {{ with .PrevInSection }}
    <a href="{{ .Permalink }}" class="fiction-prev" rel="prev">
      <span class="label">Previous</span>
      <span class="nav-title">{{ .Title | truncate 50 }}</span>
    </a>
  {{ end }}
  <a href="/reading-order/" class="fiction-index">Reading Order</a>
  {{ with .NextInSection }}
    <a href="{{ .Permalink }}" class="fiction-next" rel="next">
      <span class="label">Next</span>
      <span class="nav-title">{{ .Title | truncate 50 }}</span>
    </a>
  {{ end }}
</nav>
