baseURL: "https://chicago-by-night.pages.dev/"
languageCode: en-us
title: Chicago Chronicles
theme: archie
copyright: "Chicago Chronicles"

pygmentsStyle: monokai
pygmentsCodeFences: true
pygmentsCodeFencesGuessSyntax: true

pagination:
  pagerSize: 20

params:
  mode: "light"
  useCDN: false
  subtitle: "Act I: Forged in Steel. Gary, Indiana, 1990."
  description: "Chicago Chronicles — solo Vampire: The Masquerade across the southern Lake Michigan corridor"
  customcss:
    - "css/gothic.css"

menu:
  main:
    - name: Posts
      url: /posts/
      weight: 1
    - name: Campaign
      url: /campaign/
      weight: 2
    - name: Characters
      url: /characters/
      weight: 3
    - name: World
      url: /world/
      weight: 4
    - name: Method
      url: /guide/
      weight: 5
    - name: About
      url: /about/
      weight: 6

outputs:
  home:
    - HTML
    - RSS

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
