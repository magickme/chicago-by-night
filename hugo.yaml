baseURL: "https://chicago-by-night.pages.dev/"
languageCode: en-us
title: Chicago Chronicles
theme: ananke
copyright: "Chicago Chronicles"

pygmentsStyle: monokai
pygmentsCodeFences: true
pygmentsCodeFencesGuessSyntax: true

pagination:
  pagerSize: 20

params:
  mainSections:
    - posts
  description: "Chicago Chronicles — solo Vampire: The Masquerade across the southern Lake Michigan corridor"
  date_format: "January 2, 2006"
  body_classes: "avenir bg-near-white"
  background_color_class: "bg-black"
  text_color: "dark-gray"
  post_content_classes: "serif"
  show_reading_time: true
  custom_css:
    - "gothic.css"
  ananke:
    show_recent_posts: true

menu:
  main:
    - name: Posts
      url: /posts/
      weight: 1
    - name: Campaign
      url: /campaign/
      weight: 2
    - name: Characters
      url: /characters/
      weight: 3
    - name: World
      url: /world/
      weight: 4
    - name: Method
      url: /guide/
      weight: 5
    - name: About
      url: /about/
      weight: 6

outputs:
  home:
    - HTML
    - RSS

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
