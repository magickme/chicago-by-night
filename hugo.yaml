baseURL: "https://chicago-by-night.pages.dev/"
languageCode: en-us
title: Forged in Steel
theme: hugo-theme-stack

pagination:
  pagerSize: 20

params:
  mainSections:
    - posts
  description: "Solo Vampire: The Masquerade — Gary, Indiana, 1990"
  rssFullContent: true

  footer:
    since: 2026
    customText: ""

  dateFormat:
    published: "January 2, 2006"
    lastUpdated: "January 2, 2006"

  sidebar:
    compact: false
    emoji: ""
    subtitle: "Gary, Indiana. 1990. A dying steel town ruled by the dead."

  article:
    headingAnchor: false
    math: false
    toc: false
    readingTime: true
    license:
      enabled: false

  colorScheme:
    toggle: false
    default: "light"

  comments:
    enabled: false

  imageProcessing:
    content:
      widths: [800, 1600]
      enabled: true
    thumbnail:
      enabled: true

  widgets:
    homepage: []
    page: []

menu:
  main:
    - identifier: calendar
      name: Calendar
      url: /calendar/
      weight: 8
      params:
        icon: clock
    - identifier: characters
      name: Characters
      url: /characters/
      weight: 10
      params:
        icon: user
    - identifier: setting
      name: Setting
      url: /setting/
      weight: 12
      params:
        icon: categories
    - identifier: archive
      name: Archive
      url: /archives/
      weight: 15
      params:
        icon: archives
    - identifier: about
      name: About
      url: /about/
      weight: 20
      params:
        icon: link

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
