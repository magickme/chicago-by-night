baseURL: "https://chicago-by-night.pages.dev/"
languageCode: en-us
title: Chicago Chronicles
theme: hugo-theme-stack

pagination:
  pagerSize: 20

params:
  mainSections:
    - posts
  description: "Chicago Chronicles — solo Vampire: The Masquerade across the southern Lake Michigan corridor"
  rssFullContent: true

  footer:
    since: 2026
    customText: ""

  dateFormat:
    published: "January 2, 2006"
    lastUpdated: "January 2, 2006"

  sidebar:
    compact: false
    emoji: ""
    subtitle: "Chicago Chronicles. Act I: Forged in Steel. Gary, Indiana, 1990."

  article:
    headingAnchor: false
    math: false
    toc: false
    readingTime: true
    license:
      enabled: false

  colorScheme:
    toggle: false
    default: "light"

  comments:
    enabled: false

  imageProcessing:
    content:
      widths: [800, 1600]
      enabled: false
    thumbnail:
      enabled: false

  widgets:
    homepage:
      - type: categories
    page:
      - type: categories
      - type: toc

menu:
  main:
    - identifier: campaign
      name: Campaign
      url: /campaign/
      weight: 20
      params:
        icon: hash
    - identifier: characters
      name: Characters
      url: /characters/
      weight: 22
      params:
        icon: user
    - identifier: world
      name: World
      url: /world/
      weight: 24
      params:
        icon: categories
    - identifier: guide
      name: Method
      url: /guide/
      weight: 26
      params:
        icon: search
    - identifier: about
      name: About
      url: /about/
      weight: 28
      params:
        icon: link

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
