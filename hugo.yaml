baseURL: "https://chicago-by-night.pages.dev/"
languageCode: en-us
title: Forged in Steel
theme: PaperMod

pagination:
  pagerSize: 20

params:
  env: production
  description: "Solo Vampire: The Masquerade — Gary, Indiana, 1990"
  author: Forged in Steel
  defaultTheme: dark
  disableThemeToggle: true
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: false
  ShowToc: false
  TocOpen: false
  ShowShareButtons: false

  homeInfoParams:
    Title: "Forged in Steel"
    Content: >
      Gary, Indiana. New Year's Eve, 1989. A dying steel town on the shore of Lake Michigan,
      ruled by the dead and forgotten by the living.


      Solo Vampire: The Masquerade — 1st Edition chronicles played with Mythic GME 2e.

  socialIcons: []

  assets:
    favicon: "/favicon.ico"
    disableFingerprinting: true

  cover:
    hiddenInList: false
    hiddenInSingle: false

menu:
  main:
    - identifier: archive
      name: Archive
      url: /archives/
      weight: 5
    - identifier: characters
      name: Characters
      url: /darius-cole/
      weight: 10
    - identifier: guide
      name: Guide
      url: /guide/
      weight: 15
    - identifier: about
      name: About
      url: /about/
      weight: 20

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
